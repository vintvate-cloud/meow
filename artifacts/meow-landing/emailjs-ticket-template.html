<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Your Event Ticket</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F3F0E8; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #111827;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F3F0E8; padding: 40px 20px;">
    <tr>
      <td align="center">
        <!-- Main Card -->
        <table width="100%" max-width="500" cellpadding="0" cellspacing="0" style="max-width: 500px; background-color: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
          
          <!-- Header -->
          <tr>
            <td style="background-color: #D9FF00; padding: 30px 20px; text-align: center;">
              <h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #111827; letter-spacing: -0.5px;">{{event_name}}</h1>
              <p style="margin: 5px 0 0 0; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; color: #111827; opacity: 0.7;">Official Entry Ticket</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px 30px; text-align: center;">
              <p style="margin: 0 0 20px 0; font-size: 16px; font-weight: 500; color: #4B5563;">You're on the list! Please present the QR code below at the entrance.</p>
              
              <!-- QR Code -->
              <div style="margin: 30px 0; padding: 20px; background-color: #F9FAFB; border-radius: 16px; display: inline-block; border: 1px solid #E5E7EB;">
                <img src="{{qr_image_url}}" alt="Ticket QR Code" width="200" height="200" style="display: block; border: none; outline: none; border-radius: 8px;" />
              </div>

              <!-- Event Details -->
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 30px;">
                <tr>
                  <td align="center" style="padding: 15px; background-color: #F9FAFB; border-radius: 12px;">
                    <p style="margin: 0; font-size: 14px; font-weight: 700; color: #111827;">{{time}}</p>
                  </td>
                </tr>
              </table>

              <!-- Action Button -->
              <a href="{{ticket_url}}" style="display: inline-block; padding: 16px 32px; background-color: #111827; color: #D9FF00; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 50px;">View Full Ticket Online</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #F9FAFB; padding: 20px; text-align: center; border-top: 2px dashed #E5E7EB;">
              <p style="margin: 0; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; color: #9CA3AF;">Powered by MEOW</p>
            </td>
          </tr>
        </table>
        
      </td>
    </tr>
  </table>
</body>
</html>
